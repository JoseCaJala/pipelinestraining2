name: CI/CD Pipeline

on:
  push:
    branches:
      - joseCastro_p2_dev
      - joseCastro_p2_base

jobs:
  static-codecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt flake8 pytest

      - name: Lint
        run: flake8 restApp/

      - name: Run Unit Tests
        run: python -m pytest test/unit -v
    environment: develop

  build-and-push:
    needs: static-codecheck
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v3

      - name: Log in to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Set image tag
        id: tag
        run: |
          BRANCH=$(echo "${GITHUB_REF##*/}" | tr '/' '-')
          IMAGE_TAG="${BRANCH}-1.0.0-${GITHUB_RUN_NUMBER}"
          echo "IMAGE_TAG=$IMAGE_TAG"
          echo "tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build Image
        run: docker build -t josedocker14/restapp:${{ steps.tag.outputs.tag }} .

      - name: Push Image
        run: docker push josedocker14/restapp:${{ steps.tag.outputs.tag }}

      - name: List Docker Images
        run: docker images
    environment: develop

  deploy-to-dev:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Fix workspace permissions
        run: |
          sudo chown -R $USER:$USER ${{ github.workspace }}

      - uses: actions/checkout@v3

      - name: Deploy Redis Container
        run: |
          docker stop redisService || true
          docker rm redisService || true
          docker run --name redisService -p 6379:6379 -d redis:alpine
          # Verificar que Redis está corriendo
          docker ps | grep redisService

      - name: Pull latest restapp image
        run: docker pull josedocker14/restapp:${{ needs.build-and-push.outputs.tag }}

      - name: Check if restapp image exists
        run: docker images | grep josedocker14/restapp || echo "restapp image not found"

      - name: Deploy restapp Container
        run: |
          redisIP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' redisService)
          echo "Redis IP: $redisIP"
          docker stop restapp || true
          docker rm restapp || true
          docker run --name restapp --add-host redis:$redisIP -p 5000:5000 -d josedocker14/restapp:${{ needs.build-and-push.outputs.tag }}

          # Esperar a que la aplicación esté disponible
          echo "Esperando a que la aplicación esté disponible..."
          sleep 5

          # Verificar que el contenedor está corriendo
          docker ps | grep restapp
        shell: /usr/bin/bash -e {0}

      - name: Check container logs
        run: |
          echo "Container logs:"
          docker logs restapp

          # Verificar que la aplicación está respondiendo
          echo "Verificando conexión a la aplicación..."
          curl -v http://localhost:5000/ || echo "No se pudo conectar a la aplicación"

      - name: List directory contents
        run: ls -R

      - name: Run Integration Tests with Newman
        run: |
          restappIp=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' restapp)

          docker run --rm \
            --add-host "restapp:$restappIp" \
            -v ${{ github.workspace }}/utils/tests/postman:/etc/newman \
            postman/newman run collectionRestAppTest.json \
            --environment env.json

      - name: Run Load Test with Artillery
        run: |
          restappIp=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' restapp)
          docker run --rm \
            --add-host "restapp:$restappIp" \
            -v ${{ github.workspace }}/utils/tests/artillery:/app \
            -w /app \
            artilleryio/artillery run loadTest.yml

      - name: Clean up old Docker containers and images
        run: |
          echo "Removing stopped containers..."
          docker container prune -f

          echo "Removing dangling images..."
          docker image prune -f

          echo "Optionally, remove old restapp images (keeping latest)..."
          docker images --filter=reference='josedocker14/restapp' --format "{{.Repository}}:{{.Tag}}" | \
            grep -v "${{ needs.build-and-push.outputs.tag }}" | \
            xargs -r docker rmi
    environment: develop

  deploy-to-prod:
    needs: [deploy-to-dev, build-and-push]
    runs-on: self-hosted
    if: github.ref == 'refs/heads/joseCastro_p2_base'
    steps:
      - uses: actions/checkout@v3
      - name: Deploy Redis Container in Prod
        run: |
          docker stop redisServiceProd || true
          docker rm redisServiceProd || true
          docker run --name redisServiceProd -p 6380:6379 -d redis:alpine

      - name: Pull latest restapp image
        run: docker pull josedocker14/restapp:${{ needs.build-and-push.outputs.tag }}

      - name: Deploy restapp Container in Prod
        run: |
          redisIP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' redisServiceProd)
          docker stop restappProd || true
          docker rm restappProd || true
          docker run --name restappProd --add-host redis:$redisIP -p 5001:5000 -d josedocker14/restapp:${{ needs.build-and-push.outputs.tag }}

      - name: Run Integration Tests in Prod
        run: |
          export APP_PORT=5001
          source /home/joseubuntu/pyenv/bin/activate
          python -m pytest test/integration -v

      - name: Clean up old Docker containers and images
        run: |
          echo "Removing stopped containers..."
          docker container prune -f

          echo "Removing dangling images..."
          docker image prune -f

          echo "Optionally, remove old restapp images (keeping latest)..."
          docker images --filter=reference='josedocker14/restapp' --format "{{.Repository}}:{{.Tag}}" | \
            grep -v "${{ needs.build-and-push.outputs.tag }}" | \
            xargs -r docker rmi
    environment: production
